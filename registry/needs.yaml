    group: Content
    priority: active
    status: in-development
    notion_source: https://app.notion.com/p/mikeolaski/RHB-Agent-Skill-Packages-SOT-20afccbf926d80f7885accf399eb6f59
    resolved_by:
      - content-repurposing/talking-head-microclips
    definition_of_done:
